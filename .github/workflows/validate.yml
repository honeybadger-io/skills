name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skills and manifests
        run: python3 scripts/validate.py

      - name: Test the dashboards validator
        run: python3 -I -B skills/honeybadger-dashboards/scripts/test_validate.py

      - name: Check the dashboard schema copy
        run: python3 -I scripts/sync-dashboard-schema.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Claude Code plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json
