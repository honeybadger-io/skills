schema_version: "1.1"
name: alarm-broken-query
description: One alarm has a query error and has never evaluated. The agent should find it among the project's alarms and explain the fix.
tags: [alarms]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
