schema_version: "1.1"
name: investigate-support-ticket
description: A guest's support ticket about a failed checkout. The agent should find the customer's requests in Insights, see that both orders went through but the receipt page crashed (fault 5001), and flag the duplicate order.
tags: [investigate]
plugins: ["../.."]
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
