schema_version: "1.1"
name: debug-fix-named
description: A fault link for a nil bug. The agent should read one notice, check the revision, fix the code with a test, and offer a Honeybadger comment without changing anything there.
tags: [debug-errors]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(git diff:*)", "Bash(git blame:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
