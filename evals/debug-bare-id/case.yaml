schema_version: "1.1"
name: debug-bare-id
description: Only a fault ID, no link. The agent must find the project before it reads the fault.
tags: [debug-errors]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(git diff:*)", "Bash(git blame:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
