schema_version: "1.1"
name: dash-new-dashboard
description: A dashboard from a goal. The agent should discover the events, run each widget query, lay out the widgets without overlaps, and create the dashboard once without asking.
tags: [dashboards]
plugins: ["../.."]
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, "Bash(python3:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
