schema_version: "1.1"
name: debug-already-fixed
description: The deployed revision has the bug, but a newer local commit already fixes it. The agent should find that commit instead of writing a new fix.
tags: [debug-errors]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(git diff:*)", "Bash(git blame:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
