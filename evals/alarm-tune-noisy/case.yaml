schema_version: "1.1"
name: alarm-tune-noisy
description: An existing alarm fires constantly. The agent should read the alarm and its history, measure the real rate, propose a specific new threshold or query, and ask before updating.
tags: [alarms]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
