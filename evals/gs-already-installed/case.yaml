schema_version: "1.1"
name: gs-already-installed
description: Rails app that already uses Honeybadger. The agent should not reinstall it and should ask what the user wants to do.
tags: [get-started]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, WebFetch]
context:
  scaffold_script: fixture.sh
