schema_version: "1.1"
name: dash-empty-widget
description: A widget over notice events has streams ["default"], so it renders empty. The agent should read the widget, run its query, name the missing internal stream, propose the fix, and not save without asking.
tags: [dashboards]
plugins: ["../.."]
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, "Bash(python3:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
