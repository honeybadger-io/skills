schema_version: "1.1"
name: dash-undo
description: Undo an update from its backup. Since the backup, the dashboard was renamed, its default range changed, one widget was deleted, one widget's query changed, and one widget was added. The agent should back up the current state, then update once with the backup's title, default range, and widgets, keeping the ids of widgets still on the dashboard and leaving the id off the deleted one.
tags: [dashboards]
plugins: ["../.."]
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, "Edit(//tmp/**)", "Edit(//private/tmp/**)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
