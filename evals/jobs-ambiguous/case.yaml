schema_version: "1.1"
name: jobs-ambiguous
description: The app has two scheduled jobs and the user does not say which. The agent should name them and ask, not pick one and create a check-in.
tags: [monitor-jobs]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(git diff:*)", "Bash(git blame:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
