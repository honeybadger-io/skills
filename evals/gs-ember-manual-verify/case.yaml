schema_version: "1.1"
name: gs-ember-manual-verify
description: Ember app without Honeybadger. The Ember docs have no test command, so the agent should trigger a test error by hand and remove it afterward.
tags: [get-started]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, WebFetch]
context:
  scaffold_script: fixture.sh
