schema_version: "1.1"
name: alarm-plan-gated
description: The account's plan has no alarms, so create_alarm fails. The agent should explain the plan requirement and not retry in a loop or claim success.
tags: [alarms]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
