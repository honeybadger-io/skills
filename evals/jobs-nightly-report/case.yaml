schema_version: "1.1"
name: jobs-nightly-report
description: A Rails app schedules a nightly rake task with whenever. The agent should create one cron check-in for it and ping from the task with the Ruby gem.
tags: [monitor-jobs]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(git diff:*)", "Bash(git blame:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
