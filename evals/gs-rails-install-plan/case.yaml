schema_version: "1.1"
name: gs-rails-install-plan
description: Rails app without Honeybadger; a matching project exists. The agent should use it, get the key, and verify with exactly one test error, sent by the gem's install command.
tags: [get-started]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, WebFetch]
context:
  scaffold_script: fixture.sh
