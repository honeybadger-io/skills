schema_version: "1.1"
name: investigate-slow-site
description: Users report the site was slow this morning. The agent should use Insights to find the slow endpoint, the slow query, and the traffic source (a Googlebot crawl of /search), rule out a deploy, and propose a fix.
tags: [investigate]
plugins: ["../.."]
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
