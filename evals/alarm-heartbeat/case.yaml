schema_version: "1.1"
name: alarm-heartbeat
description: A missing-heartbeat alarm for a daily job. The agent should confirm the event exists, use an evaluation period that covers the job's cadence, and trigger on a count of zero.
tags: [alarms]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
