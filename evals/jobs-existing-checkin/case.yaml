schema_version: "1.1"
name: jobs-existing-checkin
description: The project already has a check-in for the nightly report job. The agent should wire the existing check-in into the task instead of creating a second one.
tags: [monitor-jobs]
plugins: ["../.."]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git show:*)", "Bash(git rev-parse:*)", "Bash(git diff:*)", "Bash(git blame:*)", "Bash(ls:*)"]
context:
  scaffold_script: fixture.sh
